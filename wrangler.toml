# Cloudflare Pages 绑定配置（作为仓库内唯一配置来源）
name = "personal-blog"
pages_build_output_dir = "."
compatibility_date = "2025-11-16"

# Preview / 本地开发默认绑定
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "blog-gallery"

[[r2_buckets]]
binding = "SECOND_BRAIN_BUCKET"
bucket_name = "second-brain-preview"

# Production 正式环境绑定（main 分支）
[[env.production.r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "blog-gallery"

[[env.production.r2_buckets]]
binding = "SECOND_BRAIN_BUCKET"
bucket_name = "second-brain-private"
