<header class="page-header container"><p class="coordinate">01 / 文章档案</p><h1>把想法写下来。</h1><p>职业转型、AI 应用、投资思考，以及日常中的观察。</p></header>
<section class="container archive-controls" aria-label="文章筛选"><div class="filter-buttons"><button class="category-btn active" data-category="all" aria-pressed="true">全部<span class="count-pill">$count</span></button>$categories</div><div class="search-row"><div class="search-wrapper"><label class="sr-only" for="searchInput">搜索文章标题、摘要与标签</label><input id="searchInput" type="search" placeholder="搜索标题、摘要或标签" autocomplete="off"><button id="searchClear" aria-label="清空搜索" hidden>×</button></div><label class="tag-select">标签<select id="tagFilter"><option value="all">全部标签</option>$tags</select></label></div><p id="searchCount" role="status" aria-live="polite">共 $count 篇文章</p></section>
<section class="container section archive-results" aria-label="文章列表"><div class="blog-grid" id="blogGrid">$cards</div><div class="search-empty" id="searchEmpty" hidden><p class="coordinate">没有匹配结果</p><h2>换个词，再找找。</h2><p>试试其他关键词，或清除当前的分类和标签。</p><button class="btn btn--primary" id="resetFilters">重置所有筛选条件 ↗</button></div></section>
